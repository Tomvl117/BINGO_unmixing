[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bingo-unmixing"
version = "0.0.1"
description = "BINGO: Blind unmixing via SVD-based Initialization Nmf with project Gradient descent and spare cOnstrain."
readme = "README.md"
authors = [{name = "Tom van Leeuwen", email = "tom@tleeuwen.nl"}]
classifiers = [
#    "Environment :: GPU :: NVIDIA CUDA :: 11",
#    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Image Processing"
]
keywords = ["Blind unmixing"]
dependencies = ["scikit-learn", "tifffile"]
requires-python = ">=3.9"
urls = { "Homepage" = "https://github.com/Tomvl117/BINGO_unmixing" }

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']

[tool.bumpver]
current_version = "0.0.1"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    '^version = "{version}"',
    '^current_version = "{version}"',
]
